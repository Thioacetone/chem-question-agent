name: Deploy to Railway

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: railway-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # 项目后端服务 ID（不变），显式指定避免 CLI 上下文中断
      RAILWAY_SERVICE_ID: "91712910-9373-461d-9b83-673f4f0e23e6"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Railway CLI
        run: |
          set -e
          npm i -g @railway/cli
          railway version

      - name: Check RAILWAY_TOKEN secret
        id: check_token
        run: |
          token="${{ secrets.RAILWAY_TOKEN }}"
          if [ -z "${token}" ]; then
            echo "token_exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::RAILWAY_TOKEN secret 未配置。请在 GitHub 仓库 Settings → Secrets and variables → Actions → New repository secret，添加 Name=RAILWAY_TOKEN，Value=你在 Railway 控制台生成的个人 Token（Project Settings → Tokens，或 Account → Tokens）。"
          else
            echo "token_exists=true" >> "$GITHUB_OUTPUT"
            echo "RAILWAY_TOKEN 已配置（prefix=${token:0:8}..., len=${#token})"
          fi

      - name: Deploy to Railway
        if: steps.check_token.outputs.token_exists == 'true'
        id: deploy
        run: |
          set -e
          # 显式指定 service + 关闭交互 + 详细日志，便于 CI 中稳定执行与失败诊断
          railway up \
            --service "${RAILWAY_SERVICE_ID}" \
            --verbose \
            --yes \
            --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID || '91712910-9373-461d-9b83-673f4f0e23e6' }}

      - name: Dump deploy status on failure
        if: failure() && steps.deploy.outcome == 'failure'
        run: |
          echo "--- railway whoami ---"
          railway whoami 2>&1 || true
          echo "--- railway status ---"
          railway status 2>&1 || true
          echo "--- railway service list ---"
          railway services 2>&1 || true
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
