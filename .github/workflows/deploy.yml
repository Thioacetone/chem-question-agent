name: Deploy to Railway

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: railway-deploy
  cancel-in-progress: false

jobs:
  notify:
    # Railway 后台 Source 已经绑定为 GitHub Repo + master，会在每次 push 后自动构建部署。
    # 本工作流只做两件事：
    #   1) 打印当前 commit 摘要，用于在 Actions 列表里确认"这次推送已经触发 Railway 侧部署"
    #   2) 构建结束后用 Railway Public Domain / 自定义域名的 /api/health 做一次健康检查，避免用户误以为没更新
    name: 触发 Railway 原生部署（GitHub Repo Source）+ 健康检查
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 打印部署摘要
        run: |
          set -e
          echo "Branch:   ${GITHUB_REF_NAME}"
          echo "Commit:   ${GITHUB_SHA}"
          echo "Message:  $(git log -1 --pretty=%s)"
          echo "Pusher:   ${GITHUB_ACTOR}"
          echo "Railway 将自动拉取 master 最新代码并重新构建（Source=GitHub Repo，无需本 Workflow 调 railway up）。"
          echo "可在 Railway 后台 → 对应项目 → Deployments 标签查看构建进度。"

      - name: 等待部署完成后健康检查
        id: healthcheck
        run: |
          set +e
          URLS=(
            "https://thioacetone-chemistry.top/api/health"
            "https://chem-question-agent-production.up.railway.app/api/health"
          )
          SLEEP=15
          TRIES=40   # 15s * 40 ≈ 10min
          ok=0
          for ((i=1;i<=TRIES;i++)); do
            for U in "${URLS[@]}"; do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$U" || echo 000)
              echo "[$i/$TRIES] $U  HTTP $code"
              if [ "$code" = "200" ]; then
                echo "✅ $U 健康检查通过"
                ok=$((ok+1))
                break 2
              fi
            done
            sleep $SLEEP
          done
          if [ "$ok" -eq 0 ]; then
            echo "⚠️  健康检查在 $((TRIES*SLEEP))s 内未返回 200，请到 Railway 后台 Deployments 确认构建状态（或 Build/Start 日志）。"
            exit 0
          fi
