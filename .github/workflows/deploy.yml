name: Deploy to Railway

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: railway-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # 项目后端服务 ID（不变），显式指定避免 CLI 上下文中断
      RAILWAY_SERVICE_ID: "91712910-9373-461d-9b83-673f4f0e23e6"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Railway CLI
        run: |
          set +e
          for i in 1 2 3; do
            npm i -g @railway/cli@latest
            if command -v railway >/dev/null 2>&1; then
              railway version
              exit 0
            fi
            echo "retry $i after 5s..."
            sleep 5
          done
          echo "::error::Failed to install Railway CLI after 3 retries"
          exit 1

      - name: Check RAILWAY_TOKEN secret
        id: check_token
        run: |
          token="${{ secrets.RAILWAY_TOKEN }}"
          if [ -z "${token}" ]; then
            echo "token_exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::RAILWAY_TOKEN secret 未配置。请在 GitHub 仓库 Settings → Secrets and variables → Actions → New repository secret，添加 Name=RAILWAY_TOKEN，Value=你在 Railway 控制台生成的个人 Token（Project Settings → Tokens，或 Account → Tokens）。"
          else
            echo "token_exists=true" >> "$GITHUB_OUTPUT"
            echo "RAILWAY_TOKEN 已配置（prefix=${token:0:8}..., len=${#token})"
          fi

      - name: Authenticate Railway CLI with token
        if: steps.check_token.outputs.token_exists == 'true'
        id: auth
        run: |
          set -euxo pipefail
          # 先打印 login/auth subcmd 的 help，确认新版入参
          railway login --help 2>&1 || true
          railway auth --help 2>&1 || true
          railway auth login --help 2>&1 || true
          railway --help 2>&1 | head -n 60 || true

          # 多种新版登录方式尝试（从官方文档兼容新旧版 CLI）
          # 方式 1: 新版 railway auth login --token
          if railway auth login --help 2>&1 | grep -qiE '(--token[^a-z]|tokens)'; then
            railway auth login --token "${RAILWAY_TOKEN}"
          # 方式 2: 老版 railway login --token
          elif railway login --help 2>&1 | grep -qiE '(--token[^a-z]|tokens)'; then
            railway login --token "${RAILWAY_TOKEN}"
          # 方式 3: 通过 $HOME/.railway 写配置（兼容 npm global 包位置，新版默认读 ~/.railway/state.json 或 config.json）
          else
            mkdir -p "$HOME/.railway"
            # 新版 state.json
            python3 -c "
import json, os, sys
token=os.environ['RAILWAY_TOKEN']
cfg={'token': token, 'projectId': '', 'environmentId': ''}
with open(os.path.expanduser('~/.railway/state.json'),'w') as f: json.dump(cfg,f)
with open(os.path.expanduser('~/.railway/config.json'),'w') as f: json.dump(cfg,f)
print('wrote ~/.railway/state.json & config.json')
"
            # 再 whoami 验证
            railway whoami 2>&1 || true
          fi
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy to Railway
        if: steps.check_token.outputs.token_exists == 'true'
        id: deploy
        run: |
          set -euxo pipefail
          # 鉴权状态验证
          railway whoami 2>&1 || true
          # 根据参数支持情况执行 up
          if railway up --help 2>&1 | grep -qE -- '(--service[^a-zA-Z]|-s,)'; then
            railway up \
              --service "${RAILWAY_SERVICE_ID}" \
              --verbose \
              --yes \
              --detach
          else
            railway up \
              --verbose \
              --yes \
              --detach
          fi
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID || '91712910-9373-461d-9b83-673f4f0e23e6' }}

      - name: Dump deploy status on failure
        if: failure()
        run: |
          echo "--- railway whoami ---"
          railway whoami 2>&1 || true
          echo "--- railway status ---"
          railway status 2>&1 || true
          echo "--- railway service list ---"
          railway services 2>&1 || true
          echo "--- ~/.railway directory listing ---"
          ls -la "$HOME/.railway" || true
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
